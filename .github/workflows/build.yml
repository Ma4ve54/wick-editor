name: Compile Wick Editor Source
on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true # Bypasses the strict runner crash

jobs:
  build-project:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Attempt Build and Find HTML
        run: |
          npm run build --if-present || true
          npm run package --if-present || true
          
          echo "=== Finding all compiled HTML files ==="
          find . -name "*.html" -not -path "*/node_modules/*"

      - name: Upload Finished Webpage
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wick-editor
          path: |
            dist/
            build/
            public/
            *.html
          if-no-files-found: warn
