name: Compile Wick Editor Source
on:
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Code Manually
        run: |
          git clone https://github.com{{ github.repository }}.git .
          git checkout ${GITHUB_REF##*/}

      - name: Install Node 16 Manually
        run: |
          curl -fsSL https://nodesource.com | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Build Web Application
        run: |
          # Install dependencies bypassing legacy version conflicts
          npm install --legacy-peer-deps || npm install --force || npm install
          
          # Run compilation commands safely
          npm run build --if-present || true
          npm run package --if-present || true
          npm run webpack --if-present || true

      - name: Find and Upload HTML Files
        run: |
          echo "=== Locate Compiled HTML ==="
          find . -name "*.html" -not -path "*/node_modules/*"
          
          # Package all output targets into a zip file manually to bypass upload plugin issues
          mkdir -p output_bundle
          cp -r dist/* output_bundle/ 2>/dev/null || true
          cp -r build/* output_bundle/ 2>/dev/null || true
          cp *.html output_bundle/ 2>/dev/null || true
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wick-editor
          path: output_bundle/
