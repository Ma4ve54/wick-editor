name: Compile Wick Editor Source
on:
  workflow_dispatch:

jobs:
  build-project:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Code Manually
        run: |
          # Clean clone directly targeting your branch
          git clone --depth=1 https://github.com{{ github.repository }}.git .

      - name: Install Node 16 Manually
        run: |
          curl -fsSL https://nodesource.com | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Build Web Application
        run: |
          # Force resolution of old npm packages
          npm install --legacy-peer-deps || npm install --force
          
          # Safely invoke the main compile scripts
          npm run build --if-present || true
          npm run package --if-present || true
          npm run webpack --if-present || true

      - name: Find and Package HTML Files
        run: |
          echo "=== Locating Compiled Output ==="
          find . -name "*.html" -not -path "*/node_modules/*"
          
          # Create an explicit directory and scrape files into it
          mkdir -p output_bundle
          cp -r dist/* output_bundle/ 2>/dev/null || true
          cp -r build/* output_bundle/ 2>/dev/null || true
          cp -r public/* output_bundle/ 2>/dev/null || true
          cp *.html output_bundle/ 2>/dev/null || true
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wick-editor
          path: output_bundle/
