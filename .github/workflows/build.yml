name: Compile Wick Editor Source
on:
  workflow_dispatch: # Allows you to trigger this manually

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16 # Adjust if the source requires an older/newer version

      - name: Install and Build
        run: |
          npm install
          npm run build --if-present
          npm run package --if-present

      - name: Upload Single HTML File
        uses: actions/upload-artifact@v4
        with:
          name: compiled-wick-editor
          path: dist/ # Adjust this path if the engine outputs to 'build/' or 'public/'
